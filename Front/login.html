<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="modal-overlay active" id="login-modal">
        <div class="modal-card">
            <button class="modal-close" id="close-modal" aria-label="Cerrar">&times;</button>
            
            <h3 class="modal-title">INICIAR SESIÓN</h3>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">USUARIO</label>
                    <input type="text" id="email" required placeholder="Ej: admin o profe" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>

            <div class="modal-divider">
                <span>¿PRIMERA VEZ?</span>
            </div>

            <button type="button" class="btn-secondary" id="btn-register">REGISTRARSE</button>
        </div>
    </div>

</body>
</html>
